[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditgym"
version = "0.4.0"
description = "Reproducible RL environment for training AI receivables auditors on synthetic books"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[project.scripts]
auditgym = "auditgym.cli:main"

[tool.setuptools.packages.find]
include = ["auditgym*"]

[tool.setuptools.package-data]
auditgym = ["configs/*.json", "schemas/*.json"]
